<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36" fill="none">
  <defs>
    <linearGradient id="jh-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#161f30" />
    </linearGradient>
    <linearGradient id="jh-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="jh-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#10b981" flood-opacity="0.4" />
    </filter>
  </defs>
  <!-- Background squircle with subtle highlight border -->
  <rect width="36" height="36" rx="9" fill="url(#jh-bg)" />
  <rect x="0.5" y="0.5" width="35" height="35" rx="8.5" stroke="rgba(255,255,255,0.15)" stroke-width="1" />

  <!-- Radar / Opportunity crosshair ring -->
  <circle cx="21.5" cy="14.5" r="7.5" stroke="rgba(255,255,255,0.2)" stroke-width="1.2" stroke-dasharray="2.5 2.5" />
  
  <!-- Terminal Prompt Chevron (">") with crisp geometry -->
  <path d="M8.5 11L14.5 16L8.5 21" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Career Target Radar Node (Emerald glow) -->
  <circle cx="21.5" cy="14.5" r="3" fill="url(#jh-emerald)" filter="url(#jh-glow)" />
  <circle cx="21.5" cy="14.5" r="1" fill="#ffffff" />

  <!-- Terminal Underscore / Runway Line -->
  <line x1="12" y1="24.5" x2="21" y2="24.5" stroke="url(#jh-emerald)" stroke-width="2.5" stroke-linecap="round" />
</svg>
